<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와이파이 탐정</title>
<style>
  :root { --bg: #F4F7F8; --paper: #fff; --line: #CBD6DA; --ink: #102026; --ink3: #74878E; --accent: #0B6F79; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
         padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 22px; }
  .me { background: var(--accent); color: #fff; font-weight: 900; font-size: 22px; padding: 4px 14px; border-radius: 999px; }
  h2 { margin: 0 0 8px; font-size: 19px; }
  .map { position: relative; }
  .map canvas { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; border: 2px solid var(--line); border-radius: 12px; background: #fff; touch-action: manipulation; }
  .zone { text-align: center; font-size: 17px; font-weight: 800; margin-top: 6px; }
  .bars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .bars button { font: inherit; border: 3px solid var(--line); background: var(--paper); border-radius: 14px; font-size: 17px; font-weight: 800; color: var(--ink);
                 cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 2px; }
  .bars button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .bars .ic { display: flex; align-items: flex-end; gap: 3px; height: 28px; }
  .bars .ic i { width: 7px; background: #D5DEE1; border-radius: 2px; }
  .bars .ic i:nth-child(1) { height: 25%; } .bars .ic i:nth-child(2) { height: 50%; } .bars .ic i:nth-child(3) { height: 75%; } .bars .ic i:nth-child(4) { height: 100%; }
  .bars .ic i.f { background: currentColor; }
  .gens { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .gens button { font: inherit; border: 3px solid var(--line); background: var(--paper); border-radius: 12px; padding: 8px 2px; font-size: 17px; font-weight: 900; color: var(--ink); cursor: pointer; }
  .gens button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .status { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 17px; display: flex; flex-direction: column; gap: 4px; }
  .status .big { font-size: 22px; font-weight: 900; }
  .speed { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; }
  .speed i { width: 18px; height: 18px; border-radius: 50%; background: #9AA5AB; flex: none; }
  .hint { color: var(--ink3); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<header><b>와이파이 탐정</b><span class="me" id="me">-</span></header>

<section class="map">
  <h2>1. 내 자리를 콕 찍어요</h2>
  <canvas id="room" width="420" height="588" aria-label="시청각실 지도. 내 자리를 눌러요"></canvas>
  <p class="zone" id="zone">지도에서 내 자리를 눌러 주세요</p>
</section>

<section>
  <h2>2. 내 폰의 와이파이 막대는 몇 칸?</h2>
  <p class="hint">화면 맨 위 와이파이 표시를 보고 눌러요. 자리를 옮기면 다시 눌러요.</p>
  <div class="bars" id="bars"></div>
</section>

<section>
  <h2>3. 휴대폰 데이터(LTE·5G) 막대는 몇 칸?</h2>
  <p class="hint">와이파이 옆의 안테나 막대예요. 옆에 보이는 글자(5G, LTE)도 골라요. 안 보이면 넘어가도 돼요.</p>
  <div class="gens" id="gens"></div>
  <div class="bars" id="cbars"></div>
</section>

<div class="status">
  <span class="speed"><i id="speedDot"></i><span id="speed">와이파이 속도 재는 중…</span></span>
  <span class="big" id="sent">아직 안 보냈어요</span>
  <p class="hint">이 페이지는 통신 세기와 속도, 지도에 찍은 자리만 보내요. 이름이나 GPS 위치는 보내지 않아요.</p>
</div>

<script src="/shared/signal.js"></script>
<script>
(function () {
  "use strict";
  var S = window.WTSignal;
  var cfg = null, others = [];
  var id = null, pos = null, zone = null, bars = null, cbars = null, gen = null, rtt = null, mbps = null;
  function $(x) { return document.getElementById(x); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function post(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }

  // ---------- 미니 지도 ----------
  var cv = $("room"), ctx = cv.getContext("2d");
  function sc() { return cv.width / cfg.room.width_m; }
  function nearestZone(p) {
    var best = null, bd = 1e9;
    Object.keys(cfg.zones).forEach(function (k) {
      var z = cfg.zones[k].pos, d = Math.hypot(z[0] - p[0], z[1] - p[1]);
      if (d < bd) { bd = d; best = k; }
    });
    return best;
  }
  function dot(p, r, color, label, mine) {
    var x = p[0] * sc(), y = p[1] * sc();
    if (mine) { ctx.beginPath(); ctx.arc(x, y, r + 9, 0, Math.PI * 2); ctx.strokeStyle = "#102026"; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
    if (label) { ctx.fillStyle = "#102026"; ctx.font = "bold " + (mine ? 16 : 12) + "px sans-serif"; ctx.textAlign = "center"; ctx.fillText(label, x, y + r + (mine ? 24 : 14)); }
  }
  function draw() {
    if (!cfg) return;
    var R = cfg.room, k = sc();
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = "#E9DCC6"; ctx.fillRect(0, 0, cv.width, R.stage_depth_m * k);
    ctx.fillStyle = "#6B5B45"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("앞 · 강단 · 스크린", cv.width / 2, R.stage_depth_m * k / 2);
    ctx.fillStyle = "rgba(160,176,182,.3)";
    Object.keys(R.blocks).forEach(function (b) {
      var xs = Object.keys(R.blocks[b]).map(function (q) { return R.blocks[b][q]; });
      var x0 = Math.min.apply(null, xs) - 0.9, x1 = Math.max.apply(null, xs) + 0.9;
      for (var r = 0; r < R.rows; r++) { var yy = R.row_start_m + r * R.row_gap_m; ctx.fillRect(x0 * k, (yy - 0.3) * k, (x1 - x0) * k, 0.6 * k); }
    });
    ctx.fillStyle = "#9AAAB0"; ctx.font = "13px sans-serif";
    Object.keys(cfg.zones).forEach(function (q) {
      var z = cfg.zones[q];
      if (q !== "ST") ctx.fillText(z.name, z.pos[0] * k, z.pos[1] * k);
    });
    var ap = cfg.ap.pos;
    ctx.beginPath(); ctx.arc(ap[0] * k, ap[1] * k, 13, 0, Math.PI * 2); ctx.fillStyle = "#0B6F79"; ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.fillText("AP", ap[0] * k, ap[1] * k);
    ctx.textBaseline = "alphabetic";
    others.forEach(function (n) { if (n.id !== id && n.pos) dot(n.pos, 8, S.speed(n.mbps, n.lost).color, n.id, false); });
    if (pos) dot(pos, 13, S.speed(mbps).color, "나", true);
  }
  cv.addEventListener("click", function (e) {
    if (!cfg) return;
    var r = cv.getBoundingClientRect();
    pos = [(e.clientX - r.left) / r.width * cfg.room.width_m, (e.clientY - r.top) / r.height * cfg.room.depth_m];
    pos = [Math.round(pos[0] * 100) / 100, Math.round(pos[1] * 100) / 100];
    zone = nearestZone(pos);
    store("wt-pos", JSON.stringify(pos));
    $("zone").textContent = "가까운 구역: " + cfg.zones[zone].name;
    draw(); send();
  });

  // ---------- 막대 버튼 ----------
  function barButtons(box, onPick) {
    for (var n = 0; n <= 4; n++) (function (n) {
      var b = document.createElement("button"); b.dataset.n = n;
      b.innerHTML = '<span class="ic">' + [1, 2, 3, 4].map(function (i) { return '<i class="' + (i <= n ? "f" : "") + '"></i>'; }).join("") + "</span>" + n + "칸";
      b.addEventListener("click", function () { onPick(n); paint(); send(); });
      box.appendChild(b);
    })(n);
  }
  barButtons($("bars"), function (n) { bars = n; });
  barButtons($("cbars"), function (n) { cbars = n; });
  [["5G", "5G"], ["LTE", "LTE"], ["3G", "3G"], ["", "잘 모름"]].forEach(function (g) {
    var b = document.createElement("button"); b.textContent = g[1]; b.dataset.g = g[0];
    b.addEventListener("click", function () { gen = g[0]; paint(); send(); });
    $("gens").appendChild(b);
  });
  function paint() {
    [].forEach.call($("bars").children, function (b) { b.classList.toggle("on", +b.dataset.n === bars); });
    [].forEach.call($("cbars").children, function (b) { b.classList.toggle("on", +b.dataset.n === cbars); });
    [].forEach.call($("gens").children, function (b) { b.classList.toggle("on", gen !== null && b.dataset.g === gen); });
  }

  function send() {
    if (!id) return;
    post("/api/phone", { id: id, zone: zone, pos: pos, bars: bars, cell_bars: cbars, cell_gen: gen, rtt: rtt, mbps: mbps }).then(function (r) {
      if (r.error) { $("sent").textContent = r.error; return; }
      $("sent").textContent = !zone ? "지도에서 내 자리를 찍어 주세요" : bars === null ? "와이파이 막대 수를 눌러 주세요"
        : cfg.zones[zone].name + " · 와이파이 " + bars + "칸" + (cbars !== null ? " · " + (gen || "데이터") + " " + cbars + "칸" : "") + " 보냈어요";
    }).catch(function () { $("sent").textContent = "노트북과 연결이 끊겼어요"; });
  }

  // ---------- 속도: 응답 시간 3회 중앙값 + 256KB 내려받기 ----------
  function measure() {
    var times = [];
    function ping() {
      var t0 = performance.now();
      return fetch("/api/ping?_=" + Math.random(), { cache: "no-store" }).then(function () { times.push(performance.now() - t0); });
    }
    ping().then(ping).then(ping).then(function () {
      times.sort(function (a, b) { return a - b; }); rtt = times[1];
      var t0 = performance.now();
      return fetch("/api/blob?_=" + Math.random(), { cache: "no-store" }).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
        var sec = Math.max(0.001, (performance.now() - t0) / 1000);
        mbps = Math.round(buf.byteLength * 8 / 1e6 / sec * 10) / 10;
      });
    }).then(function () {
      var sp = S.speed(mbps);
      $("speedDot").style.background = sp.color;
      $("speed").textContent = "내 와이파이 속도 " + mbps + " Mbps (" + sp.word + ") · 응답 " + Math.round(rtt) + "ms";
      draw();
    }).catch(function () { $("speed").textContent = "노트북에 닿지 않아요"; mbps = null; });
  }

  function pollOthers() {
    fetch("/api/state", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
      others = s.nodes.filter(function (n) { return n.src === "phone"; }); draw();
    }).catch(function () {});
  }

  function start() {
    try { pos = JSON.parse(store("wt-pos") || "null"); } catch (e) { pos = null; }
    if (pos) { zone = nearestZone(pos); $("zone").textContent = "가까운 구역: " + cfg.zones[zone].name; }
    draw(); measure(); pollOthers();
    setInterval(measure, 5000);
    setInterval(pollOthers, 2000);
    setInterval(function () { if (zone && bars !== null) send(); }, 2000);
  }

  fetch("/api/config").then(function (r) { return r.json(); }).then(function (c) {
    cfg = c;
    id = store("wt-run") === c.run ? store("wt-id") : null;  // 서버를 다시 켰으면 번호를 새로 받는다
    if (id) { $("me").textContent = id; start(); return; }
    return post("/api/phone/join", {}).then(function (r) {
      id = r.id; store("wt-id", id); store("wt-run", c.run); $("me").textContent = id; start();
    });
  }).catch(function () { $("sent").textContent = "노트북 핫스팟에 먼저 접속해 주세요"; });
})();
</script>
</body>
</html>
